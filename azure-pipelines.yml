# Azure DevOps build for the AAXWarehouseTools package and its models (AAXWarehouseTools and
# AAXBlindReceiving), together with the other packages deployed beside it.
#
# Runs on a Microsoft-hosted agent with no Finance and Operations installation: the X++ build
# packages are restored from the Azure Artifacts feed in pipeline/nuget.config, the ZPL renderer
# is built into the package bin folder, each package is compiled, and one set of deployable
# packages holding all of them is published. Applying a deployable package replaces an
# environment's custom packages, so every package that belongs there is built here. Azure DevOps
# setup is described in docs/BuildPipeline.md.

name: $(Date:yy.MM.dd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - '*.md'
      - '*.html'

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - '*.md'
      - '*.html'

# The other packages. Each GitHub repository's root is a package folder, like this repository's.
# Pushes to these repositories don't trigger this build; their changes ship with its next run.
resources:
  repositories:
    - repository: AAXFOIndexSentinel
      type: github
      endpoint: github.com_NathanClouseAX
      name: NathanClouseAX/AAXFOIndexSentinel
      ref: refs/heads/main
    - repository: AAXWarehouseDimensionLink
      type: github
      endpoint: github.com_NathanClouseAX
      name: NathanClouseAX/AAXWarehouseDimensionLink
      ref: refs/heads/master
    - repository: AAXPOCloseHelper
      type: github
      endpoint: github.com_NathanClouseAX
      name: NathanClouseAX/AAXPOCloseHelper
      ref: refs/heads/master
    - repository: AAXDataEntities
      type: github
      endpoint: github.com_NathanClouseAX
      name: NathanClouseAX/AAXDataEntities
      ref: refs/heads/master
    # Holds the AAXParameterWorkflow package under src/xpp/models
    - repository: MVPFO
      type: git
      name: MVP-FO
      ref: refs/heads/main

pool:
  vmImage: windows-2022

variables:
  # Each repository root is a package folder, so it is checked out below a Metadata folder to give
  # the X++ build its <Metadata>\<Package> layout. Paths derive from Pipeline.Workspace because
  # Build.SourcesDirectory moves with the checkouts: a single checkout with a custom path repoints
  # it at the checkout folder.
  MetadataPath: $(Pipeline.Workspace)\s\Metadata
  PackagePath: $(Pipeline.Workspace)\s\Metadata\AAXWarehouseTools
  NugetConfigsPath: $(Pipeline.Workspace)\s\Metadata\AAXWarehouseTools\pipeline
  NugetsPath: $(Pipeline.Workspace)\NuGets
  ToolsPackage: Microsoft.Dynamics.AX.Platform.CompilerPackage
  PlatPackage: Microsoft.Dynamics.AX.Platform.DevALM.BuildXpp
  App1Package: Microsoft.Dynamics.AX.Application1.DevALM.BuildXpp
  App2Package: Microsoft.Dynamics.AX.Application2.DevALM.BuildXpp
  AppSuitePackage: Microsoft.Dynamics.AX.ApplicationSuite.DevALM.BuildXpp
  ArtifactName: drop

steps:
  - checkout: self
    path: s/Metadata/AAXWarehouseTools
    clean: true

  - checkout: AAXFOIndexSentinel
    path: s/Metadata/AAXFOIndexSentinel

  - checkout: AAXWarehouseDimensionLink
    path: s/Metadata/AAXWarehouseDimensionLink

  - checkout: AAXPOCloseHelper
    path: s/Metadata/AAXPOCloseHelper

  - checkout: AAXDataEntities
    path: s/Metadata/AAXDataEntities

  - checkout: MVPFO
    path: s/MVP-FO

  # The X++ build reads every package from one metadata folder
  - task: CopyFiles@2
    displayName: Copy AAXParameterWorkflow from MVP-FO
    inputs:
      SourceFolder: $(Pipeline.Workspace)\s\MVP-FO\src\xpp\models\AAXParameterWorkflow
      Contents: '**'
      TargetFolder: $(MetadataPath)\AAXParameterWorkflow

  - task: Cache@2
    displayName: Cache build packages
    inputs:
      key: 'nuget | "$(Agent.OS)" | $(NugetConfigsPath)\packages.config'
      path: $(NugetsPath)
      cacheHitVar: NUGET_CACHE_RESTORED

  - task: NuGetAuthenticate@1
    displayName: Authenticate to Azure Artifacts

  # Fails fast with the identity and permission to fix when the build identity can't read the feed
  - task: PowerShell@2
    displayName: Check feed access
    condition: ne(variables.NUGET_CACHE_RESTORED, 'true')
    inputs:
      filePath: $(NugetConfigsPath)\Test-FeedAccess.ps1
      arguments: -NugetConfigPath "$(NugetConfigsPath)\nuget.config"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: NuGetCommand@2
    displayName: Install build packages
    condition: ne(variables.NUGET_CACHE_RESTORED, 'true')
    retryCountOnTaskFailure: 2
    inputs:
      command: custom
      arguments: >-
        install -NonInteractive
        "$(NugetConfigsPath)\packages.config"
        -ConfigFile "$(NugetConfigsPath)\nuget.config"
        -Verbosity Detailed
        -ExcludeVersion
        -OutputDirectory "$(NugetsPath)"

  # Stamps every model descriptor in the package with the build number
  - task: XppUpdateModelVersion@0
    displayName: Update model version
    inputs:
      XppSourcePath: $(MetadataPath)
      VersionNumber: $(Build.BuildNumber)

  # The renderer project's post-build step places the merged assembly in the package bin folder,
  # which the X++ build copies into the compiled package.
  - task: VSBuild@1
    displayName: Build ZPL renderer
    inputs:
      solution: $(PackagePath)\Projects\AAXWarehouseTools\AtomicAx.Zpl.Render\AtomicAx.Zpl.Render.csproj
      vsVersion: '17.0'
      configuration: Release
      msbuildArgs: '-restore -p:TargetFramework=net472'

  # Each package's project, relative to its package folder. The packages don't reference one
  # another, so their order doesn't matter.
  - template: pipeline/build-packages.yml
    parameters:
      packages:
        - name: AAXWarehouseTools
          project: Projects\AAXWarehouseTools\AAXWarehouseTools\AAXWarehouseTools.rnrproj
        - name: AAXFOIndexSentinel
          project: projects\AAXFOIndexSentinel\AAXFOIndexSentinel.rnrproj
        - name: AAXWarehouseDimensionLink
          project: Projects\AAX_InventLocationDimLink\AAX_InventLocationDimLink\AAX_InventLocationDimLink.rnrproj
        - name: AAXPOCloseHelper
          project: Projects\AAXPOCloseHelper\AAXPOCloseHelper\AAXPOCloseHelper.rnrproj
        - name: AAXDataEntities
          project: Projects\AAXDataEntities\AAXDataEntities\AAXDataEntities.rnrproj
        - name: AAXParameterWorkflow
          project: Projects\AAXParameterWorkflow\AAXParameterWorkflow\AAXParameterWorkflow.rnrproj

  # Packages every compiled package in the binaries folder
  - task: XppCreatePackage@2
    displayName: Create deployable packages
    inputs:
      XppToolsPath: $(NugetsPath)\$(ToolsPackage)
      XppBinariesPath: $(Build.BinariesDirectory)
      XppBinariesSearch: '*'
      DeployablePackagePath: $(Build.ArtifactStagingDirectory)\AXDeployableRuntime_$(Build.BuildNumber).zip
      CreateRegularPackage: true
      CreateCloudPackage: true

  - task: PublishPipelineArtifact@1
    displayName: Publish artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: $(ArtifactName)
